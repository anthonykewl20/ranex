# are cross-checked against this catalog during admission. A key may appear under
# exactly one principal, a principal holds exactly one role, and a retired key
# attributes past work while authorising none. `load_principals` refuses this
# file if the blocks ever disagree about who owns a key.
#
# No approver principal is declared. Adding one requires generating key
# material, which is the owner's act and not a slice's.
