# Authoring skeleton; executable schema is registered under schemas/.
# Empty placeholders are invalid for SEALED or runtime artifacts; human AI-G2
# acceptance and runtime producer enforcement remain pending.
# This projection never authors a domain score. It binds the immutable
# per-control assessments required by one VITAL-SDLC-001 domain and derives
# result, floor level, and highest-precedence priority.
schema_version: "1"
artifact_type: capability_domain_projection
projection_id: "capability_domain_projection_<uuidv7>"
revision: 1
status: NOT_ASSESSED # CapabilityAssessmentStatus; shared with the source assessments
definition_status: DEFINED # Registry/domain definition exists; runtime capability remains unassessed.
definition_evidence_refs: []
subject_schema: "research-subject/v1"
subject_ref: ""
subject_digest: ""
subject_manifest_digest: ""
core_sdlc_trace_ref: ""

policy_id: "POL-SDLC-001"
policy_version: "1.4.0"
rubric_id: "SDLC-MEA-002"
rubric_version: "3.0.0"

scope:
  domain_id: ""
  service_ids: []
  value_stream_ids: []
  work_classes: []
  risk_lanes: []
  window_start: ""
  window_end: ""
  scope_digest: ""

vital_profile:
  profile_id: "VITAL-SDLC-001"
  profile_version: "1.1.0"
  profile_digest: ""
  applicability_registry_id: "APPLICABILITY-SDLC-001"
  applicability_registry_version: "1.1.0"
  applicability_registry_digest: ""

# Exactly one member is required for every registered tuple in scope.
# No extra, duplicate, remapped, stale, or cross-scope member is allowed.
members:
  - domain_id: ""
    control_id: ""
    applicability_rule_id: ""
    assessment_ref: ""
    assessment_revision: 0
    assessment_digest: ""
    assessment_scope_digest: ""
    applicability_result: UNKNOWN # APPLICABLE | NOT_APPLICABLE | UNKNOWN
    rating_result: NOT_ASSESSED # NOT_ASSESSED | UNKNOWN | NOT_APPLICABLE | SCORED
    level: null # null unless rating_result is SCORED; otherwise 0 | 1 | 2 | 3 | 4
    priority_tier: null # null for valid NOT_APPLICABLE; otherwise P0...P3

validation:
  exact_tuple_set_result: NOT_CHECKED # NOT_CHECKED | PASS | FAIL
  no_duplicate_or_extra_member_result: NOT_CHECKED
  identical_scope_and_window_result: NOT_CHECKED
  immutable_binding_result: NOT_CHECKED
  applicability_rating_consistency_result: NOT_CHECKED
  validation_evidence_refs: []

# These fields are computed from validated members and cannot be overridden.
derivation:
  registered_member_count: 0
  bound_member_count: 0
  applicable_member_count: 0
  not_applicable_member_count: 0
  begun_applicable_member_count: 0
  scored_applicable_member_count: 0
  derived_result: NOT_ASSESSED # NOT_ASSESSED | UNKNOWN | NOT_APPLICABLE | SCORED
  derived_level: null
  lowest_control_ids: []
  arithmetic_aggregation_prohibited: true

# P0 > P1 > P2 > P3. The first/highest member tier wins.
# A valid all-N/A domain has no priority tier.
priority_projection:
  priority_rule_id: "PRIORITY-SDLC-001"
  priority_rule_version: "1.0.0"
  priority_rule_digest: ""
  result: NOT_EVALUATED # NOT_EVALUATED | NOT_APPLICABLE | ASSIGNED
  derived_tier: null
  decisive_control_ids: []
  arithmetic_aggregation_prohibited: true

assessment_authority:
  projector_id: ""
  approver_id: ""
  independence_evidence_ref: ""

decision_ref: ""
approved_at: ""
prior_projection_ref: ""
supersedes_ref: ""
correction_reason: ""
created_at: ""
digest: ""
