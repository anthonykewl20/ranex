# Authoring skeleton; executable schema is registered under schemas/.
# Empty placeholders are invalid for SEALED or runtime artifacts; human AI-G2
# acceptance and runtime producer enforcement remain pending.
# One record assesses one exact control or named capability for one immutable
# scope, population snapshot, and review window. Domain floors are derived in
# CAPABILITY_DOMAIN_PROJECTION.yaml, never authored here.
schema_version: "1"
artifact_type: capability_assessment
assessment_id: "capability_assessment_<uuidv7>"
revision: 1
status: NOT_ASSESSED
definition_status: DEFINED # DEFINED means the control contract exists; it is not a runtime score.
definition_evidence_refs: []
subject_schema: "research-subject/v1"
subject_ref: ""
subject_digest: ""
subject_manifest_digest: ""
core_sdlc_trace_ref: ""

policy_id: "POL-SDLC-001"
policy_version: "1.4.0"
rubric_id: "SDLC-MEA-002"
rubric_version: "3.0.0"

scope:
  capability_id: ""
  control_id: "" # Required for a VITAL-SDLC-001 member assessment.
  service_ids: []
  value_stream_ids: []
  work_classes: []
  risk_lanes: []
  window_start: ""
  window_end: ""
  scope_digest: ""

assessment_authority:
  assessor_id: ""
  approver_id: ""
  independence_evidence_ref: ""
  conflicts: []

applicability:
  registry_id: "APPLICABILITY-SDLC-001"
  registry_version: "1.1.0"
  registry_digest: ""
  rule_id: ""
  result: UNKNOWN # APPLICABLE | NOT_APPLICABLE | UNKNOWN
  population_ref: "#/population"
  qualifying_trigger_query_ref: ""
  qualifying_trigger_query_digest: ""
  not_applicable_reason: ""
  not_applicable_approval_ref: ""
  not_applicable_audit_ref: ""

# Counts are derived from this one snapshot. They are never independently
# entered by the assessor.
population:
  snapshot_ref: ""
  snapshot_digest: ""
  eligibility_rule_ref: ""
  eligibility_query_ref: ""
  eligibility_query_digest: ""
  totals:
    eligible: 0
    included: 0
    excluded: 0
  # Include every selected work-class/risk-lane pair, including zero-count rows.
  joint_strata:
    - work_class: ""
      risk_lane: ""
      eligible: 0
      included: 0
      excluded: 0
  exclusions:
    - subject_ref: ""
      work_class: ""
      risk_lane: ""
      reason_code: ""
      approval_ref: ""
      correction_ref: ""
  sampling_method: ""
  reconciliation:
    totals_identity_result: NOT_CHECKED # eligible = included + excluded
    strata_complete_result: NOT_CHECKED
    strata_sum_to_totals_result: NOT_CHECKED
    exclusions_sum_to_excluded_result: NOT_CHECKED
    result: NOT_CHECKED # NOT_CHECKED | PASS | FAIL
    evidence_refs: []
  # Typed predicates prevent status, attempt history, outcome, and risk lane
  # from being collapsed into one misleading "class" list.
  adverse_categories:
    - category_id: CONTROL_OR_EXECUTION_OUTCOME_FAIL
      dimension: CONTROL_OR_EXECUTION_OUTCOME
      selector: FAIL
      predicate_rule_ref: ""
      query_ref: ""
      query_digest: ""
      eligible: 0
      included: 0
      excluded: 0
      derived_result: NOT_CHECKED
    - category_id: WORK_STATUS_BLOCKED
      dimension: WORK_STATUS_HISTORY
      selector: BLOCKED
      predicate_rule_ref: ""
      query_ref: ""
      query_digest: ""
      eligible: 0
      included: 0
      excluded: 0
      derived_result: NOT_CHECKED
    - category_id: WORK_STATUS_CANCELLED
      dimension: WORK_STATUS_HISTORY
      selector: CANCELLED
      predicate_rule_ref: ""
      query_ref: ""
      query_digest: ""
      eligible: 0
      included: 0
      excluded: 0
      derived_result: NOT_CHECKED
    - category_id: WORK_STATUS_ROLLED_BACK
      dimension: WORK_STATUS_HISTORY
      selector: ROLLED_BACK
      predicate_rule_ref: ""
      query_ref: ""
      query_digest: ""
      eligible: 0
      included: 0
      excluded: 0
      derived_result: NOT_CHECKED
    - category_id: REOPENED_ATTEMPT
      dimension: ATTEMPT_HISTORY
      selector: REOPENED
      predicate_rule_ref: ""
      query_ref: ""
      query_digest: ""
      eligible: 0
      included: 0
      excluded: 0
      derived_result: NOT_CHECKED
    - category_id: RISK_LANE_EMERGENCY
      dimension: RISK_LANE
      selector: EMERGENCY
      predicate_rule_ref: ""
      query_ref: ""
      query_digest: ""
      eligible: 0
      included: 0
      excluded: 0
      derived_result: NOT_CHECKED
  adverse_reconciliation_result: NOT_CHECKED

evidence:
  event_query_ref: ""
  event_query_digest: ""
  evidence_snapshot_refs: []
  enacted_practice_refs: []
  artifact_and_provenance_refs: []
  outcome_and_guardrail_refs: []
  normal_path_event_refs: []
  traversed_rejection_invalidation_exception_or_backward_event_refs: []
  data_quality_result_ref: ""
  limitations: []

capability_rating:
  # SCORED also requires gap_register.reconciliation.scored_eligibility_result PASS.
  result: NOT_ASSESSED # NOT_ASSESSED | UNKNOWN | NOT_APPLICABLE | SCORED
  level: null # null unless SCORED; otherwise 0 | 1 | 2 | 3 | 4
  label: ""
  criterion_evidence:
    - criterion_id: ""
      evidence_refs: []
      result: UNKNOWN
  ordinal_label_only: true
  arithmetic_aggregation_prohibited: true

effectiveness:
  result: UNKNOWN # UNKNOWN | REGRESSING | MIXED | MEETS_TARGET
  metric_spec_ids: []
  baseline_refs: []
  comparator_refs: []
  observed_result_refs: []
  distribution_and_trend_refs: []
  guardrail_result_refs: []

# Level 3/4 and every experiment supporting level 4 bind this immutable design.
measurement_design:
  design_id: ""
  design_version: ""
  design_digest: ""
  goal_question_decision_refs: []
  metric_spec_refs: []
  metric_registry_id: "METRIC-SDLC-001"
  metric_registry_version: "1.0.0"
  fixed_comparator_ref: ""
  prospective_decision_rule_ref: ""
  decision_rule_frozen_at: ""
  minimum_meaningful_effect: ""
  minimum_detectable_effect: ""
  analysis_method_ref: ""
  analysis_assumption_check_refs: []
  decision_rule_evaluation_ref: ""
  noise:
    status: NOT_ASSESSED # NOT_ASSESSED | ESTABLISHED | NOT_APPLICABLE
    floor: null
    method_ref: ""
    zero_claim_evidence_ref: ""
    zero_claim_independent_approval_ref: ""
    uncertainty_na_rule_ref: ""
    uncertainty_na_approval_ref: ""
  harness:
    harness_id: ""
    harness_version: ""
    harness_digest: ""
    configuration_ref: ""
    configuration_digest: ""
    qualification_result: NOT_CHECKED # NOT_CHECKED | PASS | FAIL
    qualification_ref: ""
    repeatability_test_refs: []
    data_quality_test_refs: []
  outcome_accounting:
    subject_failure_count: 0
    infrastructure_error_count: 0
    infrastructure_error_ledger_ref: ""

# Coverage is a view over population; it carries no duplicate count fields.
coverage:
  population_ref: "#/population"
  percentage: null # Output-only computed field; authored input must be null.
  percentage_formula: "population.totals.included / population.totals.eligible * 100; null when eligible = 0"
  by_joint_strata_ref: "#/population/joint_strata"
  reconciliation_result: NOT_CHECKED

# One register owns every evidence, population, coverage, measurement, and
# applicability gap. HIGH cannot omit a known material gap.
gap_register:
  inventory_query_ref: ""
  inventory_query_digest: ""
  entries:
    - gap_id: ""
      source_dimension: "" # EVIDENCE | POPULATION | COVERAGE | MEASUREMENT | APPLICABILITY
      source_ref: ""
      materiality: UNKNOWN # UNKNOWN | NON_MATERIAL | MATERIAL
      disposition: OPEN # OPEN | ACCEPTED_LIMITATION | CORRECTED | SUPERSEDED
      disposition_evidence_ref: ""
  reconciliation:
    source_inventory_complete_result: NOT_CHECKED
    every_gap_disposed_result: NOT_CHECKED
    unresolved_material_gap_refs: []
    scored_eligibility_result: NOT_CHECKED
    result: NOT_CHECKED

# Confidence is rule-derived. HIGH requires all seven tests PASS and independent
# sign-off. Any material unresolved gap forces LOW.
confidence:
  adequacy_rule:
    rule_id: ""
    rule_version: ""
    rule_digest: ""
    approval_ref: ""
  tests:
    sample:
      result: NOT_CHECKED # NOT_CHECKED | PASS | FAIL
      evidence_refs: []
    duration:
      result: NOT_CHECKED
      evidence_refs: []
    representativeness:
      result: NOT_CHECKED
      evidence_refs: []
    authenticity:
      result: NOT_CHECKED
      evidence_refs: []
    freshness:
      result: NOT_CHECKED
      evidence_refs: []
    missingness:
      result: NOT_CHECKED
      evidence_refs: []
    data_quality:
      result: NOT_CHECKED
      evidence_refs: []
  gap_register_ref: "#/gap_register"
  independent_assurance_signoff_ref: ""
  derived_level: LOW # LOW | MEDIUM | HIGH
  derivation_result: NOT_CHECKED
  rationale: ""

# Evaluate every registry trigger and apply P0 > P1 > P2 > P3. The first
# matching tier wins. Valid NOT_APPLICABLE has no tier.
priority:
  priority_rule_id: "PRIORITY-SDLC-001"
  priority_rule_version: "1.0.0"
  priority_rule_digest: ""
  result: NOT_EVALUATED # NOT_EVALUATED | NOT_APPLICABLE | ASSIGNED
  evaluated_trigger_results:
    - trigger_code: ""
      result: NOT_CHECKED # NOT_CHECKED | MATCH | NO_MATCH
      evidence_refs: []
  trigger_set_validation:
    exact_registry_trigger_set_result: NOT_CHECKED
    no_duplicate_trigger_result: NOT_CHECKED
    validation_evidence_refs: []
  matched_trigger_codes: []
  decisive_trigger_code: ""
  derived_tier: null # null | P0_CONTROL_NOW | P1_IMPROVE_NEXT | P2_IMPROVE_DELIBERATELY | P3_SUSTAIN
  instrumentation_action_ref: ""
  derivation_result: NOT_CHECKED
  consequence: ""
  exposure: ""
  recurrence: ""
  downstream_blocking: ""
  capability_gap: ""

findings:
  active_harm_refs: []
  invariant_breach_refs: []
  nonconformity_refs: []
  exception_refs: []
  gate_outcome_refs: []

improvement:
  linked_work_item_id: ""
  causal_stage: ""
  causal_control_id: ""
  hypothesis: ""
  bounded_change: ""
  measurement_design_ref: ""
  measurement_design_digest: ""
  owner_id: ""
  evidence_window_end: ""
  stop_or_revert_criteria: []
  review_date: ""
  effectiveness_review_ref: ""
  decision: "" # RETAIN | SCALE | SIMPLIFY | CHANGE | REVERT

decision_ref: ""
approved_at: ""
prior_assessment_ref: ""
supersedes_ref: ""
correction_reason: ""
created_at: ""
digest: ""
