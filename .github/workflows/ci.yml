name: CI

on:
  push:
  pull_request:
  # New advisories can affect static pins between pushes; scan weekly to keep
  # the Security tab truthful.
  # (GitHub disables scheduled workflows after 60 days of repo inactivity — a missing weekly run is the failure mode.)
  schedule:
    - cron: "0 9 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in about six seconds. Ten minutes is generous enough that a
    # healthy run can never reach it — cold uv download included — and short
    # enough that a hung pytest is noticed rather than billed against GitHub's
    # six-hour default.
    timeout-minutes: 10
    permissions:
      # The suite only needs to read the checked-out repository.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover needs the comparison commit and its merge-base.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
      # Lint and type gates run first so a style or type regression fails fast
      # before the slower suite. Both run via uvx with pinned versions so they
      # do not touch uv.lock (a trust root) and stay reproducible.
      - name: Lint (ruff)
        run: uvx ruff@0.16.2 check src tests
      - name: Type check (pyrefly)
        # Run inside the project env (`uv run --with`) so pyrefly can resolve the
        # project's own deps (cryptography, yaml, packaging); an isolated uvx
        # env cannot see them. verdict.py is byte-pinned by
        # tests/contract/test_kernel_unchanged.py, whose docstring forbids the
        # type-only edits pyrefly would request; it is excluded.
        run: uv run --frozen --with "pyrefly==1.2.0" pyrefly check src/ranex --project-excludes '**/verdict.py'
      # `-rs` so a test that SKIPS says so in the log. The bind-mount identity
      # tests skip on a machine without unprivileged mount namespaces, and a
      # security test that vanishes silently in CI is the same "nothing ran
      # them" gap this workflow exists to close, one level down.
      - run: uv run --frozen pytest -q -rs
      - name: Require coverage for changed lines
        env:
          # A PR is judged from its base branch's merge-base; a push is judged
          # from the state immediately before that push.
          DIFF_COVER_COMPARE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before != '0000000000000000000000000000000000000000' && github.event.before || format('origin/{0}', github.event.repository.default_branch) }}
        run: |
          uv run --frozen python -m coverage run --source=src/ranex -m pytest -q
          uv run --frozen python -m coverage xml -o coverage.xml
          uv run --frozen diff-cover coverage.xml --compare-branch="$DIFF_COVER_COMPARE_BRANCH" --fail-under=100

  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install osv-scanner (pinned)
        # Verify the release asset before executing it; the URL alone is not a trust boundary.
        run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64 -o /tmp/osv-scanner
          echo "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
      - name: Scan the committed lockfile
        id: scan
        # Upload only result-bearing scans: 0 = packages found and clean, 1 = findings. 128 means "no packages found" — a successful run that scanned nothing, whose empty SARIF must NOT be published as clean. Every other non-zero is a scanner failure. All fail closed below.
        run: |
          set +e
          /tmp/osv-scanner --lockfile=uv.lock --format=sarif --output=osv.sarif
          exit_code=$?
          echo "exit=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload SARIF
        if: "!cancelled() && (steps.scan.outputs.exit == '0' || steps.scan.outputs.exit == '1') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)"
        # v4.37.7, resolved with `gh api repos/github/codeql-action/commits/v4.37.7`.
        # Match the existing Security-tab category so a clean scan supersedes stale alerts.
        # Publish only result-bearing scans (0/1) — exit 128 is an empty scan that must not masquerade as clean — and only when this run can write to the Security tab (fork PRs get a read-only token and would 403).
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          sarif_file: osv.sarif
          category: .github/workflows/ci.yml:osv-scan
      - name: Findings block the scan
        if: steps.scan.outputs.exit != '0'
        run: |
          echo "::error::osv-scanner exit ${{ steps.scan.outputs.exit }} — vulnerabilities or scanner failure; see the Security tab"
          exit 1
