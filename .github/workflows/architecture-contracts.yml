# Deterministic architecture-contract gate.
#
# WHAT THIS IS, STATED HONESTLY. This runs on GitHub's runners, where the
# *execution* cannot be tampered with locally: a hook is a convenience an agent
# bypasses with --no-verify, whereas these steps run on a machine the committer
# does not control. That is the whole of the guarantee.
#
# It is NOT unbypassable. This file is a repository file, and `on: push` runs
# whatever version of it was pushed — anyone with write access can edit these
# steps and push the edit. GitHub protects the runner, not the workflow.
#
# WHAT IS REQUIRED, and where. Measured 2026-07-31, after the owner enabled
# protection:
#
#   main                    PROTECTED. Requires the `all contract checks`
#                           status check (the `gate` job below). Force pushes
#                           and branch deletion are blocked. No PR or review is
#                           required: a direct push is allowed if the gate is
#                           green.
#   develop                 not protected
#   bootstrap/pre-upstream  not protected  <- current working branch
#
# Two limits, stated so a green result is not over-read:
#
#   * `enforce_admins` is FALSE, by owner decision. A repository admin can
#     still push to `main` past a red gate. This is deliberate: it keeps an
#     emergency path open for a solo owner. It means the gate constrains AI
#     workers and ordinary pushes, not the owner.
#   * The working branch is unprotected, so on `bootstrap/pre-upstream` these
#     checks remain ADVISORY. They become binding when work reaches `main`.
#
# Before enabling protection this comment recorded 404s for every branch, which
# was true when written. It is kept in the revision history, not deleted: the
# earlier claim that a required check already existed was false, and the record
# of that correction is worth more than a tidy file.
#
# No model is invoked. Nothing here consumes AI tokens.
#
# STRUCTURE. Four independent checks in four jobs, then one aggregating gate.
# Previously all four ran as sequential steps in a single job, so a failure in
# an early step meant the later checks never reported at all — a drift failure
# hid the validation result entirely.
#
#   drift        regenerate and prove the tree is byte-identical
#   freshness    prove no written record contradicts the filesystem
#   validate     run the validator independently of the generator
#   concurrency  prove the publication lock holds under contention
#   gate         aggregate; the single check to require in branch protection
#
# MEASURED COST, not estimated. From run 30613547035 (old layout, passing):
# checkout 23s, generate 10s, drift 0s, validate 103s, freshness 0.06s,
# concurrency 335s, total 8m00s. New layout is bounded by the concurrency job
# at roughly 6m15s, so the saving is about 1m45s (~21%) of wall clock. It costs
# roughly 50% more billable runner minutes, because GitHub rounds each job up
# and three jobs now clone the repository independently. That trade was made
# deliberately: the wall-clock saving is modest, but each job becomes a
# self-contained, independently re-runnable proof, and no check can be hidden
# behind an unrelated failure.
#
# ACTION PINS. Pinned to commit SHA, not to a tag. A tag is mutable — an
# upstream force-push silently changes what executes here, which is the same
# defect class as an unpinned dependency. The human-readable version follows
# each SHA; both must be updated together.
#
# Verified 2026-07-31 against the GitHub API: all three pinned versions declare
# `runs.using: node24`. The predecessors (checkout@v4, upload-artifact@v4,
# setup-uv@v5) declared node20, which GitHub is deprecating and was already
# force-running on node24 with a warning on every run.
#
# Note for future upgrades: astral-sh/setup-uv publishes no moving major tag
# after v7 — `refs/tags/v8` and `refs/tags/v9` both 404; only `v8.0.0`,
# `v9.0.0` and so on exist. Resolve the SHA from an exact version tag.
name: architecture contracts

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: regenerate and prove no drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth: 0 is required here, not tidiness, and for a broader reason
      # than the previous comment gave. BOTH scripts read git objects:
      #
      #   * the generator reads ADR-0010 baseline blobs and trees with
      #     `git cat-file --batch` (generate_contracts.py:4872) and
      #     `git ls-tree` / `git rev-parse` against commit 0533e1eaf
      #     (generate_contracts.py:4973, :5129);
      #   * the validator resolves legacy test-layout fixtures with
      #     `git read-tree` (validate_contracts.py:26620) against that same
      #     commit, which is reachable only from `develop`.
      #
      # GitHub's default shallow, single-branch checkout contains neither.
      # Per actions/checkout: "0 indicates all history for all branches and
      # tags." The `freshness` job below deliberately does NOT use it.
      - name: Check out the exact revision, with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # This makes a floor-satisfying interpreter available. It does NOT pin:
      # `uv run` resolves the interpreter itself from requires-python, and may
      # select a newer one than the version installed here. The previous step
      # was named "Pin Python to the declared floor", which was false — nothing
      # pinned, and nothing asserted. The assertion below is the real check.
      - name: Make a floor-satisfying interpreter available
        run: uv python install 3.12

      # ADR-0014 LANG-PRIMARY-001 fixes Python >= 3.12. Asserting it is the
      # point; printing it is not. A runner below the declared floor is a
      # finding, and this now fails rather than merely reporting.
      - name: Assert the interpreter satisfies the declared floor
        run: |
          uv --version
          uv run --project scripts/architecture python - <<'PY'
          import sys
          floor = (3, 12)
          observed = sys.version_info[:2]
          print(f"python {sys.version.split()[0]}")
          if observed < floor:
              print(
                  f"::error::ADR-0014 LANG-PRIMARY-001 requires Python >= "
                  f"{floor[0]}.{floor[1]}; runner provides {observed[0]}.{observed[1]}"
              )
              raise SystemExit(1)
          PY

      - name: Regenerate every contract from the accepted sources
        run: |
          uv run --project scripts/architecture \
            python scripts/architecture/generate_contracts.py

      # THE DRIFT GATE. Generated output is never hand-edited, so regenerating
      # from the same sources must produce a byte-identical tree. Any diff means
      # either generated output was edited by hand, or a source changed without
      # regeneration. Both are defects; neither may reach main silently.
      #
      # Scope limit, stated so nobody over-reads a green result: this diffs only
      # what the GENERATOR writes. It cannot see drift in
      # docs/architecture/assessments/validation-report.json, whose declared
      # writer is validate_contracts.py:31793 (see the `validate` job).
      - name: Fail if regeneration changed anything
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated contracts are out of date with their sources."
            echo "Run the generator locally and commit the result."
            echo
            git --no-pager diff --stat
            echo
            git --no-pager diff | head -400
            exit 1
          fi
          echo "No drift: the committed contract tree matches its sources."

  freshness:
    name: prove no written record is stale
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Its own job, deliberately. It was previously the last step of the drift
    # job, which meant a drift failure suppressed it entirely — the exact defect
    # this restructure exists to remove. It has no dependency on the generator:
    # check_record_freshness.py makes zero subprocess/git calls and reads only
    # docs/architecture/decisions, docs/architecture/rfcs, docs/README.md and
    # docs/HANDOFF.md, none of which the generator writes.
    #
    # No fetch-depth: 0 here, for the same reason — it touches no git objects,
    # so a shallow checkout is both sufficient and faster.
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Prose records have no generator, so the drift gate cannot see them: an
      # ADR can be accepted, registered and validated while the documents
      # describing the corpus still claim an older state. This compares each
      # written claim against the filesystem. Fully mechanical — no model is
      # invoked. Measured at 0.056s.
      - name: Fail if any governance record is stale
        run: |
          uv run --project scripts/architecture \
            python scripts/architecture/check_record_freshness.py

  validate:
    name: validate independently of the generator
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Deliberately NOT `needs: drift`. This job validates the COMMITTED tree
    # without regenerating it, which is what makes it independent rather than a
    # restatement of the generator's own opinion. If the committed tree has
    # drifted, `drift` fails and the run fails with it.
    #
    # KNOWN GAP, pre-existing and NOT closed by this restructure. The validator
    # writes a tracked file — docs/architecture/assessments/validation-report.json
    # (validate_contracts.py:31793), declared generated output in
    # architecture/contracts/generated-output-authority.json. No job diffs the
    # tree after that write, so drift in that one file is invisible to CI. It is
    # not merely an oversight to fix here: the file's content is
    # environment-dependent. A runner cannot hold docs/research/books/ (it is
    # gitignored and must never be committed), so CI necessarily produces
    # `practice_corpus_validation: NOT_ASSESSED_LOCAL_ONLY` while the committed
    # file records `PASS`. Adding the diff today would fail every run. Which
    # form the committed file should carry is exactly what RFC-0007 asks the
    # owner to decide; adding the check belongs with that decision, not before.
    steps:
      - name: Check out the exact revision, with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Make a floor-satisfying interpreter available
        run: uv python install 3.12

      - name: Validate the committed contract tree
        run: |
          uv run --project scripts/architecture \
            python scripts/architecture/validate_contracts.py > validation-report.json
          python3 - <<'PY'
          import json, sys
          report = json.load(open("validation-report.json"))
          status = report.get("status")
          checks = report.get("checks", {})
          print(f"status={status}")
          print(f"scope={report.get('scope')}")
          print(f"accepted_adrs={checks.get('accepted_adrs')}")
          print(f"runtime_validation={report.get('runtime_validation')}")
          if status != "PASS":
              print(f"::error::Contract validation returned {status}: {report.get('error','')}")
              sys.exit(1)
          PY

      # Uploads the report written to the workspace root by the step above, not
      # the tracked file under docs/. `warn` rather than `error` because a
      # missing artifact is already implied by a failing step.
      - name: Upload the validation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-report
          path: validation-report.json
          if-no-files-found: warn

  concurrency_regression:
    name: prove the publication lock holds
    runs-on: ubuntu-latest
    # The longest check by design, and the reason the whole run takes as long as
    # it does: it runs the generator twice and the validator three times inside
    # a disposable clone, because it proves the tree is byte-identical after
    # contention, and that comparison is only meaningful over the complete tree.
    timeout-minutes: 20

    steps:
      - name: Check out the exact revision, with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Make a floor-satisfying interpreter available
        run: uv python install 3.12

      # Proves three things a passing validator cannot: that a validator cannot
      # read the generator's empty-denominator window and score "0 of 0 checks
      # failed" as PASS; that a second generator cannot publish while one holds
      # the lock; and that neither disturbance changes a byte of the tree.
      - name: Concurrency regression test
        run: |
          uv run --project scripts/architecture \
            python scripts/architecture/test_contract_concurrency.py

  gate:
    name: all contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [drift, freshness, validate, concurrency_regression]

    # `!cancelled()` rather than `always()`: GitHub's documentation explicitly
    # recommends it — "If you want to run a job or step regardless of its
    # success or failure, use the recommended alternative: if: ${{ !cancelled() }}".
    # With cancel-in-progress above, a superseded run should leave this check
    # cancelled, not failed.
    if: ${{ !cancelled() }}

    # One status check to require in branch protection, once protection exists.
    #
    # The result is computed from the `needs` context itself, NOT from a
    # hardcoded list of job names. That distinction is the whole value of this
    # job: an earlier version iterated three literal names, so adding a fourth
    # job to `needs` left it unchecked, and this gate printed "all checks
    # passed" while a sibling job in the same run had failed. Anything added to
    # `needs:` above is now enforced automatically.
    #
    # `cancelled` and `skipped` are treated as failures: neither is evidence
    # that anything was proven.
    #
    # RESIDUAL LIMITATION, stated rather than papered over: a job added to this
    # workflow but NOT listed in `needs:` above is still not enforced by this
    # gate. The run goes red while this check goes green. Nothing in the
    # `needs` context can see a job that is not a dependency. Reviewing that
    # `needs:` lists every job remains a human obligation.
    steps:
      - name: Require every contract check to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'

          total=$(echo "$NEEDS" | jq 'length')
          if [ "$total" -eq 0 ]; then
            echo "::error::gate declares no dependencies; nothing was checked"
            exit 1
          fi

          failures=$(echo "$NEEDS" | jq -r \
            'to_entries[] | select(.value.result != "success") | "\(.key) (result=\(.value.result))"')

          if [ -n "$failures" ]; then
            while IFS= read -r line; do
              echo "::error::$line did not succeed"
            done <<< "$failures"
            exit 1
          fi

          echo "All $total architecture-contract checks passed."
