name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in about six seconds. Ten minutes is generous enough that a
    # healthy run can never reach it — cold uv download included — and short
    # enough that a hung pytest is noticed rather than billed against GitHub's
    # six-hour default.
    timeout-minutes: 10
    permissions:
      # The suite only needs to read the checked-out repository.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover needs the comparison commit and its merge-base.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
      # `-rs` so a test that SKIPS says so in the log. The bind-mount identity
      # tests skip on a machine without unprivileged mount namespaces, and a
      # security test that vanishes silently in CI is the same "nothing ran
      # them" gap this workflow exists to close, one level down.
      - run: uv run --frozen pytest -q -rs
      - name: Require coverage for changed lines
        env:
          # A PR is judged from its base branch's merge-base; a push is judged
          # from the state immediately before that push.
          DIFF_COVER_COMPARE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before != '0000000000000000000000000000000000000000' && github.event.before || format('origin/{0}', github.event.repository.default_branch) }}
        run: |
          uv run --frozen python -m coverage run --source=src/ranex -m pytest -q
          uv run --frozen python -m coverage xml -o coverage.xml
          uv run --frozen diff-cover coverage.xml --compare-branch="$DIFF_COVER_COMPARE_BRANCH" --fail-under=100
