gates:
- gate_id: landing
  rule_id: TASK_TESTS
  blocking: true
  required_claims:
  - claim_id: tests-executed
    command:
    - /usr/bin/python3
    - -m
    - pytest
    - -q
    - -o
    - xfail_strict=true
    - --junitxml=governance/suite_results.xml
    - test_six.py
    results_artifact: governance/suite_results.xml
