# Action gates for this repository. Authored, not generated: the contract tree
# holds readiness gates, not action gates — see src/.../yaml/slice_gate_loader.py.
#
# SLICE-003: a claim declares the argv that satisfies it. `contracts-validated`
# used to be required here and nothing produced it; that was invisible only
# because `-- true` satisfied everything. There is no contracts validator to
# name, so the claim is dropped and the debt stays recorded — naming a
# placeholder command would be faking it, and leaving it required would make
# `landing` permanently unsatisfiable, which is a broken gate and not a control.
gates:
  - gate_id: landing
    rule_id: TESTS_EXECUTED
    blocking: true
    required_claims:
      - claim_id: tests-executed
        command: ["uv", "run", "pytest", "-q", "-o", "xfail_strict=true", "-p", "ranex.foundation.pytest_xpass", "--junitxml=governance/suite_results.xml"]
        results_artifact: governance/suite_results.xml
      - claim_id: host-qualification
        command: ["python", "-m", "ranex.cli.host_confinement", "qualify", "--profile", "governance/confinement/strict-local-host-v1.json", "--artifact", ".local/ranex/libexec/strict-local-v1/ranex-worker-launcher", "--manifest", "governance/confinement/native-launcher-build-v1.json", "--report=.local/ranex/qualification/strict-local-v1.json"]
        qualification_report: .local/ranex/qualification/strict-local-v1.json
      - claim_id: architecture
        command: ["python3", "-m", "ranex.foundation.arch_scan", "check", "--freeze", "governance/architecture-freeze.json", "--expected-freeze-digest", "sha256:e7325bdc592efb301cfca4d267984d2b9eea6f3b87887ba33a1f8693525515f8", "--output-format=sarif", "--output-file=governance/arch/scan.sarif"]
        results_artifact: governance/arch/scan.sarif
        results_reporter: sarif-2.1.0
        results_manifest: governance/arch/scan-manifest.json
