[project]
name = "ranex"
version = "0.0.0"
description = "Deterministic governance for AI agents that build software"
requires-python = ">=3.11,<3.15"
dependencies = [
    "PyYAML>=6.0.2,<7",
    # SLICE-002. There is no asymmetric primitive in the standard library, and
    # the verifier must not hold anything that could sign — see the slice's
    # Decisions for why HMAC was refused.
    "cryptography>=43,<47",
]

[dependency-groups]
dev = [
    "coverage>=7.10,<8",
    "diff-cover>=9.7,<10",
    # 3.6 renamed paths_to_mutate; keep the measured, repository-proven 3.5
    # configuration until that migration is made deliberately.
    "mutmut>=3.5,<3.6",
    "pytest>=9.0.2,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mutmut]
paths_to_mutate = ["src/ranex/"]
pytest_add_cli_args_test_selection = [
    "tests/",
    "--ignore=tests/contract/",
    # e2e tests launch Python subprocesses, where mutmut's in-process
    # trampoline is not initialised, and assert docstrings the trampoline strips.
    "--ignore=tests/e2e/",
    "--ignore=tests/security/test_slice003_bind_mount_identity.py",
    # Mutating key confinement can write a generated private key into the real
    # repository before the copied test observes the refusal has failed.
    "--ignore=tests/security/test_keygen_key_confinement.py",
]

[project.scripts]
ranex = "ranex.cli.main:main"
