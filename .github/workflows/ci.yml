name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in about six seconds. Ten minutes is generous enough that a
    # healthy run can never reach it — cold uv download included — and short
    # enough that a hung pytest is noticed rather than billed against GitHub's
    # six-hour default.
    timeout-minutes: 10
    permissions:
      # The suite only needs to read the checked-out repository.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
      - run: uv run pytest -q
